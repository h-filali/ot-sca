target:
  target_type: cw310
  fpga_bitstream: ../objs/lowrisc_systems_chip_earlgrey_cw310_0.1.bit
  force_program_bitstream: True
  fw_bin: ../objs/firmware_fpga_cw310_test_rom_fpga_cw310_test_rom.bin
  target_clk_mult: 0.24
  target_freq: 24000000
  baudrate: 115200
  protocol: "ujson"
  port: "/dev/opentitan/cw310_tty_03"
  usb_serial: "51203120375053503130343233313030"
  trigger: "sw"
husky:
  usb_serial: "50203120314136503130383130313031"
  sampling_rate: 200000000
  num_segments: 1
  # Maximum number of samples that can be recorded is 98352 (11802 cycles)
  # Rejection sampling cycles
  # num_cycles: 3896
  # num_cycles: 6627
  # Decompose cycles
  # num_cycles: 7848
  num_cycles: 7000
  # num_cycles: 18999
  # VEC ADD cycles
  # num_cycles: 2189
  # VEC SUB cycles
  # num_cycles: 2190
  # VEC MUL cycles
  # num_cycles: 4755
  # VEC MAC cycles
  # num_cycles: 5592
  # NTT cycles
  # num_cycles: 8791
  # INTT cycles
  # num_cycles: 9862
  # Do not capture 5000 nops that are inserted to give the trigger time to rise.
  offset_cycles: 5000
  scope_gain: 27
capture:
  scope_select: husky
  num_traces: 1500
  show_plot: True
  plot_traces: 100
  trace_db: ot_trace_library
  trace_threshold: 10000
test:
  # which_test: ml_dsa_reject_fvsr
  which_test: ml_dsa_decompose_fvsr
  # which_test: ml_dsa_vec_add_batch_fvsr
  # which_test: ml_dsa_vec_sub_batch_fvsr
  # which_test: ml_dsa_vec_mul_batch_fvsr
  # which_test: ml_dsa_vec_mac_batch_fvsr
  # which_test: ml_dsa_vec_ntt_fvsr
  # which_test: ml_dsa_vec_intt_fvsr

  # seed for PRNG to generate sequence of plaintexts and keys; Python random
  # class on host, Mersenne twister implementation on OT SW.
  batch_prng_seed: 0

  # 32-bit seed for masking on device. To switch off the masking, use 0 as LFSR seed.
  lfsr_seed: 0x00000000
  # lfsr_seed: 0xdeadbeef
